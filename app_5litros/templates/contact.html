<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POLARI – Contact</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/accent.js') }}"></script>
</head>
<body>
    <canvas id="dotGrid" class="home-grid"></canvas>

    <div class="page-container">
        <div class="page-content">

            <div class="page-section">
                <h2>Email</h2>
                <p><a href="mailto:hello@studiopolari.com" class="page-link">hello@studiopolari.com</a></p>
            </div>

            <div class="page-section">
                <h2>Location</h2>
                <p>Madrid, Spain</p>
            </div>

            <!-- <div class="page-section">
                <h2>Social</h2>
                <p>
                    <a href="#" class="page-link">Instagram</a> ·
                </p>
            </div> -->
        </div>
    </div>

    <div class="page-nav bottom-nav">
        <a href="/" class="nav-link">home</a>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById("dotGrid");
        const ctx = canvas.getContext("2d");
        let mouse = { x: -9999, y: -9999 };
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        function draw() {
            const w = window.innerWidth, h = window.innerHeight;
            const [ar, ag, ab] = getAccentRGB();
            ctx.clearRect(0, 0, w, h);
            for (let y = 7.5; y < h; y += 15) {
                for (let x = 7.5; x < w; x += 15) {
                    const dx = x - mouse.x, dy = y - mouse.y;
                    const glow = Math.max(0, 1 - Math.sqrt(dx*dx+dy*dy) / 50);
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(${ar},${ag},${ab},${0.15 + glow * 0.6})`;
                    ctx.arc(x, y, 1 + glow * 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            requestAnimationFrame(draw);
        }
        window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener("mouseleave", () => { mouse.x = -9999; mouse.y = -9999; });
        window.addEventListener("resize", resize);
        resize(); draw();
    })();
    </script>
</body>
</html>
