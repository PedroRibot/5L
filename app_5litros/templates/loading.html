<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Loading – 5 Litros</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .loading-container { text-align: center; }
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #4fc3f7;
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h2>{{ message }}</h2>
        <p>The page will automatically reload when data is ready.</p>
    </div>

    <script>
        const socket = io();
        // The URL the user originally requested – passed from the server.
        const returnUrl = {{ return_url | tojson }};

        // If the server pushes a data_updated event, redirect immediately.
        socket.on('data_updated', function() {
            window.location.href = returnUrl;
        });

        // Poll every 5 s as a fallback.
        setInterval(function() {
            fetch('/api/reload?return_url=' + encodeURIComponent(returnUrl))
                .then(r => r.json())
                .then(data => {
                    if (data.has_data) {
                        window.location.href = data.return_url || returnUrl;
                    }
                })
                .catch(() => {});
        }, 5000);
    </script>
</body>
</html>
