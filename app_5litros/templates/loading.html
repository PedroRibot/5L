<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .loading-container {
            text-align: center;
        }
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h2>{{ message }}</h2>
        <p>The page will automatically reload when data is ready.</p>
    </div>
    
    <script>
        const socket = io();
        
        // Listen for data update notification
        socket.on('data_updated', function(data) {
            console.log('Data is now available:', data);
            // Redirect to return URL or default to '/'
            window.location.href = data.return_url || '/';
        });
        
        // Poll every 5 seconds to check if data is available
        setInterval(() => {
            fetch('/api/reload')
                .then(response => response.json())
                .then(data => {
                    if (data.has_data) {
                        // Use the return URL from the API response
                        window.location.href = data.return_url || '/';
                    }
                })
                .catch(err => console.log('Checking for data...'));
        }, 5000);
    </script>


</body>
</html>
