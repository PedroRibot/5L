<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>5L – Global</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/accent.js') }}"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container-table">
        <table class="data-table">
            <thead>
                <tr><th colspan="4" class="title-header">
                    <h1>GLOBAL AI IMAGING · TOTAL VOLUME ESTIMATION</h1>
                </th></tr>
            </thead>
            <thead>
                <tr>
                    <th></th>
                    <th></th>
                    <th>IMAGES / DAY</th>
                    <th>LITERS / DAY</th>
                </tr>
            </thead>
            <tbody>
                <tr class="total-row">
                    <td class="platform">ESTIMATED TOTAL DAILY</td>
                    <td><em>Grok AI, NanoBanana Pro, Meta Imagine…</em></td>
                    <td id="total-counter">0</td>
                    <td id="total-liters">0</td>
                </tr>
            </tbody>
        </table>
    </div>

    {% if not expo %}
    <div class="page-nav bottom-nav">
        <a href="/play/random" class="nav-link">5L</a>
    </div>
    {% endif %}

    <script>
        function animateCounter(elementId, totalPerDay) {
            const el = document.getElementById(elementId);
            const now = new Date();
            const secNow = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            let count = Math.floor((secNow / 86400) * totalPerDay);
            const perSec = totalPerDay / 86400;
            function fmt(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
            el.textContent = fmt(count);
            setInterval(function() {
                count += perSec * 0.1;
                if (count <= totalPerDay) el.textContent = fmt(count);
            }, 100);
        }

        window.onload = function() {
            const sd  = {{ global_data.get('StableDiffusion', {}).get('images_per_day', 0) }};
            const gg  = {{ global_data.get('GoogleGemini',    {}).get('images_per_day', 0) }};
            const mj  = {{ global_data.get('Midjourney',      {}).get('images_per_day', 0) }};
            const dal = {{ global_data.get('DALLE',           {}).get('images_per_day', 0) }};
            const mi  = {{ global_data.get('MetaImagine',     {}).get('images_per_day', 0) }};
            const avg = {{ average_today }};
            const total = sd + gg + mj + dal + mi;
            animateCounter('total-counter', total);
            animateCounter('total-liters',  total * avg);
        };
    </script>
</body>
</html>
